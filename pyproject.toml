[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opengrowtwin"
version = "0.1.0"
description = "Auditable spectral photon solver for an OpenUSD horticultural digital twin"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
opengrow = "opengrow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
