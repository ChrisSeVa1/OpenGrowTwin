[package]
title = "OpenGrowTwin Live Simulation"
version = "0.1.0"
description = "Interactive orchestration for the OpenGrowTwin photon solver"
category = "Simulation"
keywords = ["horticulture", "lighting", "OpenUSD", "digital twin"]
readme = "README.md"
repository = "https://github.com/ChrisSeVa1/OpenGrowTwin"

[dependencies]
"omni.kit.uiapp" = {}
"omni.kit.pipapi" = {}
"omni.usd" = {}

[python.pipapi]
requirements = ["PyYAML==6.0.2"]
use_online_index = true

[[python.module]]
name = "opengrow_twin"

[settings]
exts."opengrow.twin".auto_simulate = true
exts."opengrow.twin".debounce_seconds = 0.25
